{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101318">
    <meta
      name="description"
      content="Adivinhe o profissional de Counter-Strike. Um desafio diário, novas pistas a cada tentativa."
    >
    <title>{% block title %}CSGuess — Clássico{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'game/css/classic.css' %}?v=classic-hints-logos-1">
    {% block scripts %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o jogo</a>
    <div class="screen">
      <header class="sitebar">
        <a class="logo" href="{% url 'game:home' %}" aria-label="CSGuess, início">CS<b>Guess</b><span>COUNTER-STRIKE DAILY</span></a>
        <nav class="modes" aria-label="Modos de jogo">
          <a href="{% url 'game:home' %}"{% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'classic-page' %} aria-current="page"{% endif %}>Clássico</a>
          <a href="{% url 'game:logo-page' %}"{% if request.resolver_match.url_name == 'logo-page' %} aria-current="page"{% endif %}>Logo</a>
        </nav>
        <button id="help-open" type="button" aria-label="Ajuda: como jogar" aria-haspopup="dialog">?</button>
      </header>

      {% block content %}{% endblock %}
    </div>
    {% block dialogs %}{% endblock %}
  </body>
</html>
